version: '3.8'

services:
  # PostgreSQL база данных
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-prikol}
      POSTGRES_USER: ${POSTGRES_USER:-prikol_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-prikol_user}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  # Веб-сервер
  web:
    build: .
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=postgresql://${POSTGRES_USER:-prikol_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-prikol}?schema=public
    volumes:
      - ./logs:/app/logs
    restart: unless-stopped
    command: npm start
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - app-network

  # Telegram бот
  bot:
    build: .
    environment:
      - NODE_ENV=production
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:?TELEGRAM_BOT_TOKEN required}
      - DATABASE_URL=postgresql://${POSTGRES_USER:-prikol_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-prikol}?schema=public
    volumes:
      - ./logs:/app/logs
    restart: unless-stopped
    command: npm run bot
    depends_on:
      postgres:
        condition: service_healthy
      web:
        condition: service_healthy
    networks:
      - app-network

  # Nginx reverse proxy (опционально)
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    restart: unless-stopped
    depends_on:
      - web
    networks:
      - app-network

volumes:
  postgres_data:

networks:
  app-network:
    driver: bridge
