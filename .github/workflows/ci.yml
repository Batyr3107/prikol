name: CI/CD

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  # Lint и проверка кода
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Check code style (если есть ESLint)
        run: npm run lint --if-present
        continue-on-error: true

  # Проверка безопасности
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Run npm audit
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: Check for secrets
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: main
          head: HEAD

  # Build Docker images
  build:
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build Docker image
        run: docker build -t prikol:${{ github.sha }} .

      - name: Test Docker image
        run: |
          docker run -d --name test-container \
            -e NODE_ENV=production \
            -e DATABASE_URL=file:/app/data/test.db \
            prikol:${{ github.sha }} npm start
          sleep 10
          docker logs test-container
          docker stop test-container

  # Deploy на production (только для main branch)
  deploy:
    runs-on: ubuntu-latest
    needs: [lint, security, build]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v3

      - name: Deploy notification
        run: echo "Готов к деплою на production"

